# Loki configuration for local development.

auth_enabled: false

server:
  # Loki listens on port 3100.
  http_listen_port: 3100

common:
  # Single-instance Loki deployment.
  instance_addr: 127.0.0.1

  # Store logs on the container's persistent volume.
  path_prefix: /loki

  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

  replication_factor: 1

  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Disable usage reporting.
analytics:
  reporting_enabled: false