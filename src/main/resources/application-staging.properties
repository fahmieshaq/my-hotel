spring.datasource.url=${DB_URL_STAGING}
spring.datasource.username=${DB_USER_STAGING}
spring.datasource.password=${DB_PASSWORD_STAGING}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.jpa.show-sql=false

# Keep staging logging close to production.
# Enable DEBUG temporarily only when investigating an issue.
logging.level.com.maz.my_hotel=INFO
