spring.datasource.url=${DB_URL_DEV}
spring.datasource.username=${DB_USER_DEV}
spring.datasource.password=${DB_PASSWORD_DEV}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Show detailed application diagnostics during development.
# Third-party libraries remain at INFO.
logging.level.com.maz.my_hotel=DEBUG

# Show individual health checks during development.
# Do not enable this publicly in production.
management.endpoint.health.show-details=always

# Write application logs to a file.
# Console logging remains enabled.
logging.file.name=logs/hotel-api.log
