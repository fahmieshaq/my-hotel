spring.datasource.url=${DB_URL_PROD}
spring.datasource.username=${DB_USER_PROD}
spring.datasource.password=${DB_PASSWORD_PROD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.jpa.show-sql=false

# Record important business events and operational warnings/errors.
# Exclude routine DEBUG and TRACE diagnostics.
logging.level.com.maz.my_hotel=INFO
