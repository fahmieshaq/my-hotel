spring.application.name=my-hotel
spring.profiles.default=dev
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================================
# LOGGING CONFIGURATION - LOGBACK configuration for Spring Boot application
# ============================================================================

# Configure the format of application logs printed to the console.
#
# %d{yyyy-MM-dd HH:mm:ss.SSS} = Timestamp with milliseconds.
# %-5level                  = Log level (INFO, WARN, ERROR, etc.).
# %thread                   = Thread processing the request.
# %X{requestId}             = Request ID retrieved from MDC.
# %X{correlationId}         = Correlation ID retrieved from MDC.
# %logger{36}               = Logger name, shortened to 36 characters.
# %msg                      = Actual log message.
# %n                        = New line.
# If MDC contains requestId, display its value. Otherwise, display N/A.
# Use UTC for consistent timestamps across servers and environments.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS XXX, UTC} %-5level [%thread] [requestId=%X{requestId:-N/A}] [correlationId=%X{correlationId:-N/A}] %logger{36} - %msg%n
