spring.application.name=my-hotel
spring.profiles.default=dev
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================================
# LOGGING CONFIGURATION - LOGBACK configuration for Spring Boot application
# ============================================================================

# Configure the format of application logs printed to the console.
#
# %d{yyyy-MM-dd HH:mm:ss.SSS} = Timestamp with milliseconds.
# %-5level                  = Log level (INFO, WARN, ERROR, etc.).
# %thread                   = Thread processing the request.
# %X{requestId}             = Request ID retrieved from MDC.
# %X{correlationId}         = Correlation ID retrieved from MDC.
# %logger{36}               = Logger name, shortened to 36 characters.
# %msg                      = Actual log message.
# %n                        = New line.
# If MDC contains requestId, display its value. Otherwise, display N/A.
# Use UTC for consistent timestamps across servers and environments.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS XXX, UTC} %-5level [%thread] [requestId=%X{requestId:-N/A}] [correlationId=%X{correlationId:-N/A}] %logger{36} - %msg%n

# Default logging level for all application dependencies.
# INFO and higher-severity messages are displayed.
logging.level.root=INFO

# Logging level for our application's classes.
# INFO includes meaningful business events and failures,
# while excluding DEBUG and TRACE messages.
logging.level.com.maz.my_hotel=INFO

#### THE CONFIGURATIONS BELOW LETS YOU ACCESS THE THREE URLs BELOW (START) #####
#GET /actuator/health
#GET /actuator/health/liveness
#GET /actuator/health/readiness

# Enable liveness and readiness health groups even when
# the application is running outside Kubernetes.
management.endpoint.health.probes.enabled=true

# Expose only the health and Prometheus endpoints over HTTP.
# Other Actuator endpoints remain unexposed unless configured.
management.endpoints.web.exposure.include=health,prometheus

# Keep the general health response minimal.
# Do not expose dependency details publicly.
management.endpoint.health.show-details=never

# Readiness checks whether the application can accept traffic
# AND whether PostgreSQL is reachable.
#
# readinessState = Spring Boot's internal readiness status.
# db = Database connectivity health indicator.
management.endpoint.health.group.readiness.include=readinessState,db
#### THE CONFIGURATIONS BELOW LETS YOU ACCESS THE THREE URLs BELOW (END) #####