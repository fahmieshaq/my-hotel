name: Hotel API CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hotel-api-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

  AWS_PUBLISH_ROLE_ARN: arn:aws:iam::343482277554:role/hotel-api-github-ecr-publisher
  AWS_STAGING_ROLE_ARN: arn:aws:iam::343482277554:role/hotel-api-github-staging-deployer
  AWS_PRODUCTION_ROLE_ARN: arn:aws:iam::343482277554:role/hotel-api-github-production-deployer

  ECR_REPOSITORY: 343482277554.dkr.ecr.eu-west-2.amazonaws.com/hotel-api
  ECS_CLUSTER: shared-apps-cluster

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B clean verify

  docker-build:
    name: Docker Build
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image once
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hotel-api:${{ github.sha }}
          outputs: type=docker,dest=/tmp/hotel-api.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-api-image
          path: /tmp/hotel-api.tar
          retention-days: 1

  publish-ecr:
    name: Publish to ECR
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: hotel-api-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/hotel-api.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and publish existing image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "hotel-api:$IMAGE_TAG" "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Resolve immutable image digest
        id: image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          
          DIGEST=$(aws ecr describe-images \
            --repository-name hotel-api \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          
          test -n "$DIGEST"
          test "$DIGEST" != "None"
          
          echo "image_uri=$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy Staging
    needs: publish-ecr
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: staging
      url: https://staging-api.asmreditor.com

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy image to staging
        timeout-minutes: 20
        env:
          SERVICE: hotel-api-staging
          IMAGE_URI: ${{ needs.publish-ecr.outputs.image_uri }}
        run: |
          set -euo pipefail
          
          CURRENT_TASK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          
          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK" \
            --query 'taskDefinition' \
            --output json > current-task.json
          
          jq --arg IMAGE "$IMAGE_URI" '
            {
              family,
              taskRoleArn,
              executionRoleArn,
              networkMode,
              containerDefinitions,
              volumes,
              placementConstraints,
              requiresCompatibilities,
              cpu,
              memory,
              runtimePlatform,
              ephemeralStorage,
              pidMode,
              ipcMode,
              proxyConfiguration,
              inferenceAccelerators
            }
            | with_entries(select(.value != null))
            | .containerDefinitions |= map(
                if .name == "hotel-api"
                then .image = $IMAGE
                else .
                end
              )
          ' current-task.json > new-task.json
          
          NEW_TASK=$(aws ecs register-task-definition \
            --cli-input-json file://new-task.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "Registered task definition: $NEW_TASK"
          
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$NEW_TASK" \
            --query 'service.serviceName' \
            --output text
          
          # Poll the exact deployment created by this workflow.
          # ECS service stability can precede rolloutState=COMPLETED.
          MAX_ATTEMPTS=90
          SLEEP_SECONDS=10

          for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
            SERVICE_JSON=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$SERVICE" \
              --output json)

            FAILURE=$(jq -r '.failures[0].reason // empty' <<< "$SERVICE_JSON")
            if [ -n "$FAILURE" ]; then
              echo "ERROR: Could not describe ECS service: $FAILURE"
              exit 1
            fi

            STATE=$(jq -r --arg TASK "$NEW_TASK" '
              .services[0].deployments[]?
              | select(.taskDefinition == $TASK)
              | .rolloutState // "UNKNOWN"
            ' <<< "$SERVICE_JSON" | head -n 1)

            PRIMARY_TASK=$(jq -r '
              .services[0].deployments[]?
              | select(.status == "PRIMARY")
              | .taskDefinition
            ' <<< "$SERVICE_JSON" | head -n 1)

            RUNNING=$(jq -r '.services[0].runningCount' <<< "$SERVICE_JSON")
            DESIRED=$(jq -r '.services[0].desiredCount' <<< "$SERVICE_JSON")
            DEPLOYMENT_COUNT=$(jq -r '.services[0].deployments | length' <<< "$SERVICE_JSON")

            echo "Attempt $attempt/$MAX_ATTEMPTS: rollout=${STATE:-NOT_FOUND}, running=$RUNNING/$DESIRED, deployments=$DEPLOYMENT_COUNT"

            if [ "$STATE" = "FAILED" ]; then
              echo "ERROR: ECS deployment failed."
              exit 1
            fi

            if [ "$STATE" = "COMPLETED" ] && \
               [ "$PRIMARY_TASK" = "$NEW_TASK" ] && \
               [ "$RUNNING" = "$DESIRED" ] && \
               [ "$DEPLOYMENT_COUNT" -eq 1 ]; then
              echo "Deployment completed successfully: $NEW_TASK"
              break
            fi

            if [ -z "$STATE" ] && [ "$PRIMARY_TASK" != "$NEW_TASK" ]; then
              echo "ERROR: New deployment disappeared; ECS may have rolled back."
              exit 1
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "ERROR: ECS deployment did not complete within 15 minutes."
              exit 1
            fi

            sleep "$SLEEP_SECONDS"
          done

      - name: Verify staging readiness
        run: |
          set -euo pipefail
          
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            https://staging-api.asmreditor.com/actuator/health/readiness \
            | jq -e '.status == "UP" and .components.db.status == "UP"'

  deploy-production:
    name: Deploy Production
    needs: [publish-ecr, deploy-staging]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: production
      url: https://api.asmreditor.com

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy approved image to production
        timeout-minutes: 20
        env:
          SERVICE: hotel-api-prod
          IMAGE_URI: ${{ needs.publish-ecr.outputs.image_uri }}
        run: |
          set -euo pipefail
          
          CURRENT_TASK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          
          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK" \
            --query 'taskDefinition' \
            --output json > current-task.json
          
          jq --arg IMAGE "$IMAGE_URI" '
            {
              family,
              taskRoleArn,
              executionRoleArn,
              networkMode,
              containerDefinitions,
              volumes,
              placementConstraints,
              requiresCompatibilities,
              cpu,
              memory,
              runtimePlatform,
              ephemeralStorage,
              pidMode,
              ipcMode,
              proxyConfiguration,
              inferenceAccelerators
            }
            | with_entries(select(.value != null))
            | .containerDefinitions |= map(
                if .name == "hotel-api"
                then .image = $IMAGE
                else .
                end
              )
          ' current-task.json > new-task.json
          
          NEW_TASK=$(aws ecs register-task-definition \
            --cli-input-json file://new-task.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "Registered task definition: $NEW_TASK"
          
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$NEW_TASK" \
            --query 'service.serviceName' \
            --output text
          
          # Poll the exact deployment created by this workflow.
          # ECS service stability can precede rolloutState=COMPLETED.
          MAX_ATTEMPTS=90
          SLEEP_SECONDS=10

          for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
            SERVICE_JSON=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$SERVICE" \
              --output json)

            FAILURE=$(jq -r '.failures[0].reason // empty' <<< "$SERVICE_JSON")
            if [ -n "$FAILURE" ]; then
              echo "ERROR: Could not describe ECS service: $FAILURE"
              exit 1
            fi

            STATE=$(jq -r --arg TASK "$NEW_TASK" '
              .services[0].deployments[]?
              | select(.taskDefinition == $TASK)
              | .rolloutState // "UNKNOWN"
            ' <<< "$SERVICE_JSON" | head -n 1)

            PRIMARY_TASK=$(jq -r '
              .services[0].deployments[]?
              | select(.status == "PRIMARY")
              | .taskDefinition
            ' <<< "$SERVICE_JSON" | head -n 1)

            RUNNING=$(jq -r '.services[0].runningCount' <<< "$SERVICE_JSON")
            DESIRED=$(jq -r '.services[0].desiredCount' <<< "$SERVICE_JSON")
            DEPLOYMENT_COUNT=$(jq -r '.services[0].deployments | length' <<< "$SERVICE_JSON")

            echo "Attempt $attempt/$MAX_ATTEMPTS: rollout=${STATE:-NOT_FOUND}, running=$RUNNING/$DESIRED, deployments=$DEPLOYMENT_COUNT"

            if [ "$STATE" = "FAILED" ]; then
              echo "ERROR: ECS deployment failed."
              exit 1
            fi

            if [ "$STATE" = "COMPLETED" ] && \
               [ "$PRIMARY_TASK" = "$NEW_TASK" ] && \
               [ "$RUNNING" = "$DESIRED" ] && \
               [ "$DEPLOYMENT_COUNT" -eq 1 ]; then
              echo "Deployment completed successfully: $NEW_TASK"
              break
            fi

            if [ -z "$STATE" ] && [ "$PRIMARY_TASK" != "$NEW_TASK" ]; then
              echo "ERROR: New deployment disappeared; ECS may have rolled back."
              exit 1
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "ERROR: ECS deployment did not complete within 15 minutes."
              exit 1
            fi

            sleep "$SLEEP_SECONDS"
          done

      - name: Verify production readiness
        run: |
          set -euo pipefail
          
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            https://api.asmreditor.com/actuator/health/readiness \
            | jq -e '.status == "UP" and .components.db.status == "UP"'
