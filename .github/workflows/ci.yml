
name: Hotel API CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B clean verify

  docker-build:
    name: Docker Build
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image once
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hotel-api:${{ github.sha }}
          outputs: type=docker,dest=/tmp/hotel-api.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-api-image
          path: /tmp/hotel-api.tar
          retention-days: 1

  publish-ecr:
    name: Publish to ECR
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: hotel-api-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/hotel-api.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::343482277554:role/hotel-api-github-ecr-publisher
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and publish the existing image
        env:
          ECR_REPOSITORY: 343482277554.dkr.ecr.eu-west-2.amazonaws.com/hotel-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "hotel-api:$IMAGE_TAG" "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
